[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herramienta-dnd"
version = "0.1.0"
description = "Open-source D&D campaign management tool"
requires-python = ">=3.11"
authors = [{name = "Pablo", email = "pablo.federico2804@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
